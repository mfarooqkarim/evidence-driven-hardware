# .streamlit/config.toml
# Theme tokens matched to the CSS design system in app.py.
# These provide the Streamlit-native layer; the injected <style> block
# overrides anything not reachable via config.toml.

[theme]
# Accent / interactive elements
base = "dark"
primaryColor      = "#65d46e"

# Page background
backgroundColor   = "#07110d"

# Widget / card background
secondaryBackgroundColor = "#0d1813"

# Main text
textColor         = "#eef7f0"

# Font (Streamlit falls back to system sans-serif if not bundled)
font              = "sans serif"
